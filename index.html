<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>Unduh SIKEBOS Desktop</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
  body{
    margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
    background:#FAF8F2; font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
    text-align:center; padding:24px; box-sizing:border-box;
  }
  .card{ background:#fff; border:1px solid #e5e2da; border-radius:14px; padding:40px 32px; max-width:420px; box-shadow:0 4px 20px rgba(0,0,0,.05); }
  h1{ font-size:22px; color:#1B2A4A; margin:0 0 8px; }
  p{ color:#555; font-size:14px; line-height:1.6; margin:0 0 24px; }
  .btn{
    display:inline-block; background:#1B2A4A; color:#fff; text-decoration:none;
    padding:14px 28px; border-radius:8px; font-weight:600; font-size:15px;
  }
  .btn:hover{ background:#28406e; }
  .note{ margin-top:18px; font-size:12px; color:#999; }
  .spinner{
    width:28px; height:28px; border:3px solid #e5e2da; border-top-color:#1B2A4A;
    border-radius:50%; margin:0 auto 20px; animation:spin 0.8s linear infinite;
  }
  @keyframes spin{ to{ transform:rotate(360deg); } }
</style>
</head>
<body>
  <div class="card">
    <div class="spinner" id="spinner"></div>
    <h1>SIKEBOS Desktop</h1>
    <p id="status">Unduhan akan dimulai secara otomatis dalam beberapa detik...</p>
    <a class="btn" id="downloadBtn" href="https://github.com/siakadsdntanjung-glitch/LAPORAN-BOSP-ONLINE/releases/download/v1.0.0/SIKEBOS.Setup.1.0.0.exe">Unduh Sekarang (.exe)</a>
    <p class="note">Untuk Windows. Jalankan file yang terunduh untuk memulai instalasi.</p>
  </div>

  <script>
    // GANTI URL di bawah ini dengan link download .exe dari GitHub Releases Anda
    const DOWNLOAD_URL = "https://github.com/siakadsdntanjung-glitch/LAPORAN-BOSP-ONLINE/releases/download/v1.0.0/SIKEBOS.Setup.1.0.0.exe";

    document.getElementById('downloadBtn').href = DOWNLOAD_URL;

    // Auto-download setelah 1.5 detik
    setTimeout(() => {
      window.location.href = DOWNLOAD_URL;
      document.getElementById('spinner').style.display = 'none';
      document.getElementById('status').textContent =
        'Jika unduhan tidak dimulai otomatis, klik tombol di bawah ini:';
    }, 1500);
  </script>
</body>
</html>
